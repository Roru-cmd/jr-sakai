<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sakai Line</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
</head>
<body>
  <div class="container">
  <h1>JR SAKAI LINE TIMETABLE</h1>
  <hr>

  <div id="date" class="me-2"></div>
  <h4>Fare</h4>
  <div class="row">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
      <div class="d-flex justify-content-between">
        <div>• Sakaiminato - Yonago</div>
        <div id="fare-s-y"></div>
      </div>
      <div class="d-flex justify-content-between">
        <div>• Sakaiminato - Yonago Airport</div>
        <div id="fare-s-ay"></div>
      </div>
    </div>
  </div>

  <h3>
    <span id="weekdays-tab" style="cursor: pointer; text-decoration: underline;">WEEKDAYS</span>
    &nbsp;|&nbsp;
    <span id="weekends-tab" class="text-muted" style="cursor: pointer;">WEEKENDS</span>
  </h3>

  <div class="timetable-header mt-2 d-flex justify-content-between align-items-center">
    <h2 id="route-title" class="mb-0">Yonago → Sakaiminato</h2>
    <button id="toggle-direction" class="btn btn-outline-primary btn-toggle">
      Reverse Direction
    </button>
  </div>
  <div id="trains-list">
    <div class="text-muted">Loading…</div>
  </div>
</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
