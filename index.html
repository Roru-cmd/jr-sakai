<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JR Sakai Line</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" />
  <link rel="stylesheet" href="public/styles.css" />
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
</head>
<body>
  <div class="container">
    <!-- Кнопка переключения направления -->
    <button id="toggle-direction" class="btn btn-primary btn-toggle">
      Opposite Direction
    </button>

    <!-- Шапка страницы -->
    <div class="timetable-header mb-4">
      <h1 id="route-title">Yonago → Sakaiminato</h1>
      <div class="travel-time" id="travel-time">Required time: JR Sakai Line – 44 min ~</div>
    </div>

    <!-- Блок управления (дата, время, фильтр) -->
    <div class="controls mb-4">
      <div class="d-flex align-items-center">
        <label for="date-picker" class="me-2">Дата:</label>
        <input type="date" id="date-picker" value="2024-03-16" />
      </div>
      <div class="d-flex align-items-center">
        <label for="time-picker" class="me-2">Время:</label>
        <input type="time" id="time-picker" value="00:00" />
      </div>
      <div class="d-flex align-items-center">
        <label for="line-select" class="me-2">Фильтр поездов:</label>
        <select id="line-select">
          <option value="all">All</option>
        </select>
      </div>
    </div>
    <div id="trains-list">
      <div class="text-muted">Загрузка расписания…</div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script src="public/app.js"></script>
</body>
</html>
