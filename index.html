<body>
  <header >
    <h1 class="text-center w-100">JR SAKAI LINE TIMETABLE</h1>
  </header> 
  <main>
    <div class="container">
      <div id="date" class="date me-2"></div>
      <h4>Fare</h4>
      <div class="row">
        <div class="fare-s-y col-12 col-sm-8 col-md-6 col-lg-4">

          </div>
        </div>
      </div>
      <div class="toggle-container">
        <button id="weekdays-tab" class="toggle-btn toggle-btn--active">

        </button>
        <button id="weekends-tab" class="toggle-btn">
          WEEKENDS
        </button>
      </div>
      <div class="timetable-header mt-2 d-flex justify-content-between align-items-center">
        <h2 id="route-title" class="mb-0">Yonago → Sakaiminato</h2>
        <button id="toggle-direction" class="btn btn-outline-primary btn-toggle">
          Reverse Direction
        </button>
      </div>
      <div id="trains-list">
        <div class="text-muted">Loading…</div>
      </div>
    </div>

    <script src="papaparse.min.js"></script>
    <script src="bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
