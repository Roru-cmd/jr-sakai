<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JR Sakai Line</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" />
  <link rel="stylesheet" href="public/styles.css" />
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
</head>
<body>
  
  <div class="container">
    <h1>JR SAKIMINATO LINE TIMETABLE</h1>
    <button id="toggle-direction" class="btn btn-primary btn-toggle">
      Opposite Direction
    </button>
    <div class="timetable-header mb-4">
      <h2 id="route-title">Yonago → Sakaiminato</h2>
    </div>
    <div class="controls mb-4">
      <div class="d-flex align-items-center">
        <div id="date" class="me-2"></div>
      </div>
    </div>
    <div id="trains-list">
      <div class="text-muted">Loading…</div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script src="public/app.js"></script>
</body>
</html>
